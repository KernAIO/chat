name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
permissions: { contents: read, packages: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: https://npm.pkg.github.com, scope: '@kernalo' }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
        env: { NODE_AUTH_TOKEN: '${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}' }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
