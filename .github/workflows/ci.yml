name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
permissions: { contents: read, packages: read }
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://kern:kern@127.0.0.1:5432/kern
      VALKEY_URL: redis://127.0.0.1:6379
    services:
      # The suites run against a real Postgres: they create a scratch database per file, apply the
      # migrations and prove row-level security by connecting as an unprivileged role. Nothing here
      # is mocked, so without this service the whole suite fails to start rather than quietly
      # passing.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: kern
          POSTGRES_PASSWORD: kern
          POSTGRES_DB: kern
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kern"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The gateway suite turns presence on deliberately, so it needs somewhere to store it.
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
